<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercunMurah - Premium Fireworks Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .explosive-gradient {
            background: linear-gradient(135deg, #ef4444 0%, #f97316 25%, #eab308 50%, #ef4444 75%, #dc2626 100%);
            background-size: 400% 400%;
            animation: gradientShift 3s ease-in-out infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .firework-glow {
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5), 0 0 40px rgba(249, 115, 22, 0.3);
        }
        
        .festival-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.6) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .festival-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        .product-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.7) 100%);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .product-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.4);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #334155 50%, #1e293b 75%, #0f172a 100%);
            background-size: 400% 400%;
            animation: bgShift 8s ease-in-out infinite;
        }
        
        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .sparkle {
            animation: sparkle 2s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        
        .float {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .flying-cart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease-in-out;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .backdrop-blur {
            backdrop-filter: blur(20px);
        }
        
        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translate3d(0,0,0); }
            40%, 43% { transform: translate3d(0, -30px, 0); }
            70% { transform: translate3d(0, -15px, 0); }
            90% { transform: translate3d(0, -4px, 0); }
        }
        
        .bounce {
            animation: bounce 1s ease-in-out;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <!-- Navigation -->
    <nav class="backdrop-blur border-b border-slate-700/50 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="text-2xl sparkle">🔥</div>
                    <h1 class="text-2xl font-bold explosive-gradient firework-glow">MercunMurah</h1>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" class="text-slate-300 hover:text-white transition-colors">Home</a>
                    <a href="#" class="text-slate-300 hover:text-white transition-colors">Products</a>
                    <a href="#" class="text-slate-300 hover:text-white transition-colors">Packages</a>
                    <a href="#" class="text-slate-300 hover:text-white transition-colors">Contact</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <select id="languageSelect" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1 text-sm">
                        <option value="en">English</option>
                        <option value="ms">Bahasa Malaysia</option>
                    </select>
                    
                    <div class="relative">
                        <button id="cartBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition-colors flex items-center space-x-2">
                            <span>🛒</span>
                            <span>Cart (<span id="cartCount">0</span>)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Hero Section -->
    <section class="py-20 px-4">
        <div class="max-w-7xl mx-auto text-center">
            <h2 class="text-5xl md:text-7xl font-black explosive-gradient firework-glow mb-6 float">
                Premium Fireworks Collection
            </h2>
            <p class="text-xl md:text-2xl text-slate-300 mb-8 max-w-3xl mx-auto">
                Light up your celebrations with our spectacular fireworks
            </p>
            <button class="bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-700 hover:to-orange-700 px-8 py-4 rounded-xl text-lg font-semibold transition-all transform hover:scale-105 shadow-lg">
                Shop Now 🎆
            </button>
        </div>
    </section>
    
    <!-- Featured Products -->
    <section class="py-16 px-4">
        <div class="max-w-7xl mx-auto">
            <h3 class="text-3xl font-bold text-center mb-12 explosive-gradient">Featured Products</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </section>
    
    <!-- WhatsApp Button -->
    <div class="fixed bottom-6 right-6 z-50">
        <a href="https://wa.me/60123456789" target="_blank" class="bg-green-500 hover:bg-green-600 p-4 rounded-full shadow-lg transition-all transform hover:scale-110 float">
            <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.885 3.488"/>
            </svg>
        </a>
    </div>
    
    <!-- Flying Cart Animation -->
    <div id="flyingCart" class="flying-cart hidden">
        <div class="bg-red-600 p-3 rounded-full">
            <span class="text-white text-xl">🛒</span>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="toast bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg">
        <div class="flex items-center space-x-2">
            <span>✅</span>
            <span id="toastMessage">Product added to cart!</span>
        </div>
    </div>
    
    <script>
        // Product data
        const products = [
            {
                id: 97,
                name: { en: '4 138 Shot Merdeka', ms: '4 138 Shot Merdeka' },
                price: 100,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199058/fireworks_400x400/fireworks_400x400/resized_framed_product_91_4_138_Shoot_Cake_4_138.jpg',
                videoUrl: 'http://res.cloudinary.com/de8w3ykvy/video/upload/v1753077619/HunterBoom/cm4shk2s0000g03ju9jme3n1g_wrp2hg.mp4'
            },
            {
                id: 901,
                name: { en: '5138 Shoot Cake ABC', ms: '5138 Shoot Cake (ABC)' },
                price: 250,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753198938/fireworks_400x400/fireworks_400x400/resized_framed_product_0_5138_Shoot_Cake_28ABC29.jpg',
                videoUrl: 'http://res.cloudinary.com/de8w3ykvy/video/upload/v1753076871/HunterBoom/cm4l31g5200010cmq8qeahfje_gjzsmh.mp4'
            },
            {
                id: 955,
                name: { en: '100 Shoot Flying Dragon', ms: '100 Shoot Flying Dragon' },
                price: 180,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199058/fireworks_400x400/fireworks_400x400/resized_framed_product_91_4_138_Shoot_Cake_4_138.jpg',
                videoUrl: ''
            },
            {
                id: 986,
                name: { en: 'Double Shoot Banana Besar', ms: 'Double Shoot Banana Besar' },
                price: 85,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199058/fireworks_400x400/fireworks_400x400/resized_framed_product_91_4_138_Shoot_Cake_4_138.jpg',
                videoUrl: ''
            },
            {
                id: 988,
                name: { en: '8 Shoot Roma Candle', ms: '8 Shoot Roma Candle' },
                price: 45,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199058/fireworks_400x400/fireworks_400x400/resized_framed_product_91_4_138_Shoot_Cake_4_138.jpg',
                videoUrl: ''
            },
            {
                id: 989,
                name: { en: '4 25 Shoot Cake', ms: '4 25 Shoot Cake' },
                price: 120,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199058/fireworks_400x400/fireworks_400x400/resized_framed_product_91_4_138_Shoot_Cake_4_138.jpg',
                videoUrl: ''
            },
            {
                id: 27,
                name: { en: 'Classic Pop Pop', ms: 'Pop Pop Klasik' },
                price: 25,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199087/fireworks_400x400/fireworks_400x400/resized_framed_product_38_Pop_Pop.jpg',
                videoUrl: ''
            },
            {
                id: 919,
                name: { en: 'Sunset Kayu Tiga Warna', ms: 'Sunset Kayu Tiga Warna' },
                price: 15,
                image: 'https://res.cloudinary.com/de8w3ykvy/image/upload/v1753199081/fireworks_400x400/fireworks_400x400/resized_framed_product_18_Sunset_Kayu_Tiga_Warna.jpg',
                videoUrl: 'http://res.cloudinary.com/de8w3ykvy/video/upload/v1753076913/HunterBoom/cm3flps0e000a0clb8e5pay1e_rzzlcl.mp4'
            }
        ];
        
        let currentLanguage = 'en';
        let cart = [];
        
        // Language switching
        document.getElementById('languageSelect').addEventListener('change', function(e) {
            currentLanguage = e.target.value;
            renderProducts();
        });
        
        // Render products
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card rounded-xl p-6 cursor-pointer';
                productCard.innerHTML = `
                    <div class="aspect-square mb-4 overflow-hidden rounded-lg">
                        <img src="${product.image}" alt="${product.name[currentLanguage]}" class="w-full h-full object-cover transition-transform hover:scale-110">
                    </div>
                    <h4 class="text-lg font-semibold mb-2 text-white">${product.name[currentLanguage]}</h4>
                    <p class="text-2xl font-bold text-red-400 mb-4">RM ${product.price.toFixed(2)}</p>
                    <button onclick="addToCart(${product.id})" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-700 hover:to-orange-700 py-2 px-4 rounded-lg font-semibold transition-all transform hover:scale-105">
                        Add to Cart 🛒
                    </button>
                `;
                
                if (product.videoUrl) {
                    productCard.addEventListener('click', function(e) {
                        if (!e.target.closest('button')) {
                            playVideo(product.videoUrl);
                        }
                    });
                }
                
                grid.appendChild(productCard);
            });
        }
        
        // Add to cart function
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                updateCartCount();
                showFlyingCart(event.target);
                showToast(`${product.name[currentLanguage]} added to cart!`);
            }
        }
        
        // Update cart count
        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;
        }
        
        // Flying cart animation
        function showFlyingCart(button) {
            const flyingCart = document.getElementById('flyingCart');
            const cartBtn = document.getElementById('cartBtn');
            const buttonRect = button.getBoundingClientRect();
            const cartRect = cartBtn.getBoundingClientRect();
            
            flyingCart.style.left = buttonRect.left + 'px';
            flyingCart.style.top = buttonRect.top + 'px';
            flyingCart.classList.remove('hidden');
            
            setTimeout(() => {
                flyingCart.style.left = cartRect.left + 'px';
                flyingCart.style.top = cartRect.top + 'px';
                flyingCart.style.transform = 'scale(0.5)';
            }, 100);
            
            setTimeout(() => {
                flyingCart.classList.add('hidden');
                flyingCart.style.transform = 'scale(1)';
                cartBtn.classList.add('bounce');
                setTimeout(() => cartBtn.classList.remove('bounce'), 1000);
            }, 900);
        }
        
        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // Play video function
        function playVideo(videoUrl) {
            if (videoUrl) {
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="relative max-w-4xl w-full mx-4">
                        <button onclick="this.parentElement.parentElement.remove()" class="absolute -top-10 right-0 text-white text-2xl hover:text-red-400">
                            ✕
                        </button>
                        <video controls autoplay class="w-full rounded-lg">
                            <source src="${videoUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                `;
                document.body.appendChild(modal);
                
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            }
        }
        
        // Initialize
        renderProducts();
    </script>
</body>
</html>
